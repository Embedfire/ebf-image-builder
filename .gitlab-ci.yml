variables:
  #git 邮箱
  GIT_USEREMAIL: hjw0415@outlook.com
  #git 用户名
  GIT_USERNAME: hejiawen

# 定义 stages
stages:
  - build_image

# 定义 build_image  job
build_image_job:
  tags: 
    - ENABLE
  stage: build_image
  when: manual
  #指定分支更新进行编译
  only:
    - image-builder-imx8mmini
  before_script:
    - git config --global user.email "$GIT_USEREMAIL"
    - git config --global user.name "$GIT_USERNAME"
  script:
    # 使用内部仓库
    - export SOURCE_URL=gitlab
    #编译镜像 
    - ./env/ci.sh imx8mmini



  # when: delayed
  # start_in: 180 minutes
  #start_in: 10 sec

